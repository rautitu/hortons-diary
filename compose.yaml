services:
  app:
    build:
      context: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-hortons}:${POSTGRES_PASSWORD:-hortons}@db:5432/${POSTGRES_DB:-hortons}?sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/server", "healthcheck", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    init: true
    restart: unless-stopped

  db:
    image: postgres:18.0-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hortons}
      POSTGRES_USER: ${POSTGRES_USER:-hortons}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hortons}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  postgres_data:
